alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(latency_ms) over event == "response_sent" > 2000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602614
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRateOrRetrievalFailure
    severity: critical
    condition: 'count(event == "request_failed") / count(event == "request_received") * 100 > 2 OR count(tool_success == true) / count(tool_success != null) * 100 < 90'
    duration: 3m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602614
    runbook: docs/alerts.md#alert-2
  - name: CostPerRequestSpike
    severity: warning
    condition: 'avg(cost_usd) over event == "response_sent" > 0.005'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602614
    runbook: docs/alerts.md#alert-3
